# Default stack: build the app image locally.
# For a pre-built image from GHCR, see compose.ghcr.yaml.

name: dimatech

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dimatech
      POSTGRES_PASSWORD: dimatech
      POSTGRES_DB: dimatech
    volumes:
      # Postgres 18+ images expect the volume on /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimatech -d dimatech"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/isbur/dimatech-test:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dimatech:dimatech@db:5432/dimatech
    depends_on:
      db:
        condition: service_healthy
    command: ["-m", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: ghcr.io/isbur/dimatech-test:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dimatech:dimatech@db:5432/dimatech
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
