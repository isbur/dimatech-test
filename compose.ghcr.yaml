# Pull a pre-built image from GHCR instead of building locally.
#
# Usage:
#   docker compose -f compose.yaml -f compose.ghcr.yaml pull
#   docker compose -f compose.yaml -f compose.ghcr.yaml up -d
#
# (Passing -f disables automatic compose.override.yaml merging.)

services:
  migrate:
    build: !reset
    image: ghcr.io/isbur/dimatech-test:latest
    pull_policy: always

  app:
    build: !reset
    image: ghcr.io/isbur/dimatech-test:latest
    pull_policy: always
